# Minimal starter config for noctalia-shell.
# Everything not set here falls back to noctalia's built-in defaults;
# tune further via noctalia's own Settings UI (which writes overrides to
# ~/.local/state/noctalia/settings.toml, not this file).

# calcite.json was tweaked to match the flattened panel below:
# mSurfaceVariant == mSurface (no second background shade on list rows/dropdowns),
# mOutline == mPrimary (borders use the theme purple instead of grey).
[theme]
mode = "dark"
source = "custom"
custom_palette = "calcite"

# Flattened/minimal panel look: square corners everywhere, and borders only
# on the panel itself + popups (dropdowns) rather than every card/button/input.
[shell]
corner_radius_scale = 0.0
card_borders = false
button_borders = false
input_borders = false
popup_borders = true

[wallpaper]
directory = "/home/dnl/Pictures"
fill_mode = "center"

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 900.0

[control_center]
hidden_tabs = ["media", "weather"]

# Which app configs noctalia syncs its palette into.
[theme.templates]
builtin_ids = ["foot", "gtk3", "gtk4", "kcolorscheme", "niri", "qt"]

[bar]
order = ["default"]

[bar.default]

# space_icon is used when the other side has more icons
# until this is supported: https://github.com/noctalia-dev/noctalia/issues/2304
start = []
center = ["spacer_icon","theme_mode", "caffeine", "notifications", "spacer_generic", "clock", "spacer_generic", "syncthing", "network", "bluetooth", "battery"]
end = []
margin_ends = 0
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = false

[widget.clock]
type = "clock"
format = "%a %d %b  %H:%M"
font_weight = 700

[plugins]
enabled = ["rylos/syncthing"]

[widget.syncthing]
type = "rylos/syncthing:bar"

[widget.network]
type = "network"
show_label = false

[widget.battery]
type = "battery"
show_label = false

[notification]
position = "top_center"

[shell.panel]
control_center_placement = "floating"
control_center_position = "top_center"
open_near_click_control_center = false
# Keep the panel's own outline, but drop its drop shadow and the extra
# background fill behind list rows so the panel reads as one flat surface.
borders = true
list_item_background = false
shadow = false

[widget.control_center_button.actions]
left = "panel-toggle control-center"

[widget.spacer_generic]
type = "spacer"
length = 25

# Tuned to counter the left/right icon-count
# asymmetry around the clock and pull it back to the true bar center; re-measure
# and adjust if the widget list on either side changes.
[widget.spacer_icon]
type = "spacer"
length = 20
