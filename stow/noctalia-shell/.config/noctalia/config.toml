# Minimal starter config for noctalia-shell.
# Everything not set here falls back to noctalia's built-in defaults;
# tune further via noctalia's own Settings UI (which writes overrides to
# ~/.local/state/noctalia/settings.toml, not this file).

[theme]
mode = "dark"
source = "custom"
custom_palette = "calcite"

[wallpaper]
directory = "/home/dnl/Pictures"

[bar]
order = ["default"]

[bar.default]
center = ["clock"]
end = ["network", "battery", "tray", "theme_mode", "control-center"]
# `start` is intentionally omitted to keep noctalia's built-in default
# (launcher, wallpaper, workspaces).
margin_ends = 0
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = false

[widget.clock]
type = "clock"
format = "%a %d %b  %H:%M"

[widget.network]
type = "network"
show_label = false
