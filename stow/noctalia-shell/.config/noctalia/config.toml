# Minimal starter config for noctalia-shell.
# Everything not set here falls back to noctalia's built-in defaults;
# tune further via noctalia's own Settings UI (which writes overrides to
# ~/.local/state/noctalia/settings.toml, not this file).

[theme]
mode = "dark"

[bar]
order = ["default"]

[bar.default]
center = ["clock"]
end = ["network", "battery", "tray", "control-center"]
# `start` is intentionally omitted to keep noctalia's built-in default
# (launcher, wallpaper, workspaces).

[widget.clock]
type = "clock"
format = "%a %d %b  %H:%M"

[widget.network]
type = "network"
show_label = false
