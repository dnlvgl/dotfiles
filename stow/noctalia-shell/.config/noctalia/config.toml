# Minimal starter config for noctalia-shell.
# Everything not set here falls back to noctalia's built-in defaults;
# tune further via noctalia's own Settings UI (which writes overrides to
# ~/.local/state/noctalia/settings.toml, not this file).

[theme]
mode = "dark"
source = "custom"
custom_palette = "calcite"

[wallpaper]
directory = "/home/dnl/Pictures"

[bar]
order = ["default"]

[bar.default]
start = ["launcher", "workspaces"]
center = ["clock", "notifications"]
end = ["theme_mode", "network", "bluetooth", "battery", "tray", "control_center_button"]
margin_ends = 0
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = false

[widget.clock]
type = "clock"
format = "%a %d %b  %H:%M"

[widget.network]
type = "network"
show_label = false

[widget.workspaces]
type = "workspaces"
change_color_on_hover = false
focused_color = "primary"
occupied_color = "outline"
empty_color = "outline"

[shell.panel]
control_center_placement = "floating"
control_center_position = "auto"
open_near_click_control_center = true

[widget.control_center_button]
type = "custom_button"
glyph = "settings"
tooltip = "Control Center"

[widget.control_center_button.actions]
left = "panel-toggle control-center"
