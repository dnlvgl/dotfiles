# Kitty configuration
# Run `kitty +runpy 'from kitty.config import *; print(commented_out_default_config())'`
# for all options, or see https://sw.kovidgoyal.net/kitty/conf/
# Reload with ctrl+shift+f5.

# --- Theme Switching ---
# Kitty follows the system color-scheme (set by the waybar theme toggle via
# gsettings) and loads dark-theme.auto.conf / light-theme.auto.conf from this
# directory. No-preference falls back to dark.

# --- Font ---
# Same font as emacs (dnl/default-font)
font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# Break ligatures under the cursor so they can be edited
disable_ligatures cursor
# Fira Code is tight in kitty, give lines some room
modify_font cell_height 110%

# --- Cursor ---
cursor_shape block
cursor_blink_interval 0
cursor_trail 0

# --- Window & UI ---
# No title bar, matching niri's prefer-no-csd
hide_window_decorations yes
window_padding_width 4
remember_window_size no
# Ask only when something other than the shell is running
confirm_os_window_close -1
enable_audio_bell no
visual_bell_duration 0
scrollback_lines 10000
# Extra history (MB) only shown in the ctrl+shift+h pager
scrollback_pager_history_size 32
# Touchpad scrolling is slow by default
touch_scroll_multiplier 3.0
copy_on_select no
strip_trailing_spaces smart
shell_integration enabled
# Notify via swaync when a command over 15s finishes in an unfocused window
notify_on_cmd_finish unfocused 15
# Don't nag about updates, Fedora packages kitty
update_check_interval 0

# --- Splits ---
# Only the splits layout, so new windows split the current one
enabled_layouts splits
window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.8

# --- Tabs ---
tab_bar_edge bottom
tab_bar_style separator
tab_separator " │ "
tab_bar_min_tabs 2
tab_bar_margin_width 4
tab_bar_margin_height 2 0
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal
tab_switch_strategy left

# --- Keep the current directory for new windows ---
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+n     new_os_window_with_cwd

# --- Tabs keybindings ---
map ctrl+shift+t new_tab_with_cwd
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
