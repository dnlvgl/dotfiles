# Calcite palette (see noctalia-shell/.config/noctalia/palettes/calcite.json),
# flat/square to match the waybar theme. Colors live in colors.ini, a symlink
# to colors-dark.ini/colors-light.ini flipped by the waybar theme switcher.
font=sans-serif:size=11
dpi-aware=auto
width=35
horizontal-pad=24
vertical-pad=16
inner-pad=8
include=~/.config/fuzzel/colors.ini

[border]
width=1
radius=0
selection-radius=0
