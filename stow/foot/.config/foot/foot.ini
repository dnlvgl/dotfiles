# Foot configuration, kept close to stow/kitty/.config/kitty/kitty.conf
# See `man foot.ini` for all options.
# Foot has no tabs or splits; use niri columns and tabbed columns instead.

[main]
# Same font as emacs (dnl/default-font). Foot doesn't render ligatures.
font=Fira Code:size=11
# Fira Code's line height is ~13.5pt at 11pt; 15 gives the same extra room as kitty
line-height=15
pad=4x4
# Written by stow/waybar/.config/waybar/scripts/toggle-theme.sh for new windows;
# running windows are switched with SIGUSR1/SIGUSR2
include=~/.config/foot/theme.ini

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[csd]
# No title bar, matching niri's prefer-no-csd
preferred=none

[key-bindings]
# Jump between prompts, fish emits the OSC 133 marks (like kitty's ctrl+shift+z/x)
prompt-prev=Control+Shift+z
prompt-next=Control+Shift+x
# Scrollback in a pager, like kitty's ctrl+shift+h
pipe-scrollback=[sh -c "less -R +G"] Control+Shift+h

# Calcite Dark, colors from emacs/.config/emacs/themes/calcite-theme.el
[colors-dark]
foreground=f1f1f1
background=222226
cursor=222226 f1f1f1
selection-foreground=f1f1f1
selection-background=4d3e66
urls=bda7f0
regular0=2c2b30
regular1=b85450
regular2=50d7a8
regular3=c8a830
regular4=5b8dd9
